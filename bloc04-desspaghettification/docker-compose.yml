services:
  db:
    image: postgres:16-alpine
    container_name: atelier-bloc04-db
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: registrations
      TZ: Europe/Paris
    ports:
      - "5434:5432"
    volumes:
      - ./app/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d registrations"]
      interval: 3s
      timeout: 3s
      retries: 10
