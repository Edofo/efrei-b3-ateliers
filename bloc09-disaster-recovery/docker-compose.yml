services:
  db:
    image: postgres:16-alpine
    container_name: atelier-bloc09-db
    environment:
      POSTGRES_USER: prod
      POSTGRES_PASSWORD: prod
      POSTGRES_DB: prod
      TZ: Europe/Paris
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prod -d prod"]
      interval: 3s
      timeout: 3s
      retries: 10
