services:
  db:
    image: postgres:16-alpine
    container_name: workshop-db
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: workshop
      # The business is Paris-based: database and API share one timezone.
      TZ: Europe/Paris
      PGTZ: Europe/Paris
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop"]
      interval: 3s
      timeout: 3s
      retries: 10
